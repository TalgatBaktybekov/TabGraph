<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>TabGraph</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 12px;
        font-size: 14px;
      }
      textarea {
        width: 100%;
        box-sizing: border-box;
        min-height: 60px;
        font: inherit;
        padding: 6px;
      }
      button {
        margin-top: 6px;
        padding: 6px 16px;
        cursor: pointer;
      }
      #answer {
        white-space: pre-wrap;
        margin-top: 12px;
        line-height: 1.4;
      }
      .badge {
        display: inline-block;
        font-size: 11px;
        padding: 1px 8px;
        border-radius: 9px;
        color: #fff;
        margin-top: 12px;
      }
      .cypher { background: #2a7; }
      .synthesis { background: #46c; }
      .subgraph { background: #c80; }
      .recall { background: #a5c; }
      .review-row { margin-top: 4px; font-size: 12px; }
      .review-btn {
        margin: 0 0 0 6px;
        padding: 1px 10px;
        font-size: 12px;
        cursor: pointer;
      }
      .confirmed { color: #2a7; }
      .citations li, .related li { margin: 4px 0; font-size: 13px; }
      .page-link { color: #46c; }
      .pair {
        border: 1px solid #ddd;
        border-radius: 6px;
        padding: 6px 10px;
        margin: 6px 0;
        font-size: 13px;
      }
      .pair p { margin: 4px 0; }
      .tension { border-color: #c66; }
      h4 { margin: 14px 0 4px; }
      pre {
        background: #f4f4f4;
        padding: 8px;
        overflow-x: auto;
        font-size: 12px;
        white-space: pre-wrap;
      }
      .muted { color: #888; }
      details { margin-top: 8px; }
    </style>
  </head>
  <body>
    <h3>Ask your tabs</h3>
    <textarea id="question" placeholder="e.g. Which pages mention Neo4j?"></textarea>
    <button id="ask">Ask</button>
    <div id="status" class="muted"></div>
    <div id="result"></div>
    <div id="discoveries"></div>
    <script src="panel.js"></script>
  </body>
</html>
