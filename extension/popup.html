<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        width: 220px;
        padding: 12px;
      }
      label {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
      }
      p {
        color: #666;
        font-size: 12px;
        margin-bottom: 0;
      }
    </style>
  </head>
  <body>
    <label>
      <input type="checkbox" id="capture-toggle" />
      <span>Capture tabs</span>
    </label>
    <p>Off by default. When on, page URLs (and later, content) are sent to
      your local TabGraph backend.</p>
    <script src="popup.js"></script>
  </body>
</html>
