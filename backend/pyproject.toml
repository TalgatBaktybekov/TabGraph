[project]
name = "tabgraph-backend"
version = "0.1.0"
description = "TabGraph backend: capture ingestion, KG extraction pipeline, and QA API."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "google-genai>=1.0",
    "sentence-transformers>=3.0",
    "neo4j>=5.20",
    "networkx>=3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Preferred community-detection backend; networkx Louvain is the fallback.
leiden = ["leidenalg>=0.10", "igraph>=0.11"]
